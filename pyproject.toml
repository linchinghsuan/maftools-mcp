[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "maftools-mcp"
version = "1.1.0"
description = "MCP server for R maftools"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
dependencies = [
  "fastmcp==4.0.2",
  "mcp==2.1.1",
  "rpy2==3.6.7",
  "rpy2-rinterface==3.6.6",
  "rpy2-robjects==3.6.5",
  "uvicorn==0.52.4",
  "pydantic==2.13.5"
]

[project.urls]
Repository = "https://github.com/linchinghsuan/maftools-mcp"
License = "https://github.com/linchinghsuan/maftools-mcp/blob/main/LICENSE"

[project.scripts]
maftools-mcp = "maftools_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
