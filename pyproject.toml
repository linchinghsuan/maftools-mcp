[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "maftools-mcp"
version = "0.1.0"
description = "MCP server for R maftools with traceable validation materials"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
dependencies = [
  "fastmcp @ git+https://github.com/jlowin/fastmcp.git@b3bce0c2312444f50863a9887fc3d46917bd8f71",
  "mcp==1.20.0", "rpy2==3.6.4", "rpy2-rinterface==3.6.3",
  "rpy2-robjects==3.6.3", "fastapi==0.121.0", "uvicorn==0.38.0", "pydantic==2.12.3"
]

[project.scripts]
maftools-mcp = "maftools_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
